[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# `netlify dev` serves the Vite dev server and the functions together on one
# origin, so the form's fetch("/.netlify/functions/wish") works locally the
# same way it does in production.
[dev]
  command = "npm run dev"
  targetPort = 5173
